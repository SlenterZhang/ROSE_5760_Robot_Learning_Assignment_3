agent_name: "SAC"

model:
  actor_net: "fc_2layers_64units"
  critic_net: "fc_2layers_64units"
  actor_init_output_scale: 0.01
  logstd_min: -5.0
  logstd_max: 2.0      # broad exploration

actor_optimizer:
  type: "Adam"
  learning_rate: 3e-4

critic_optimizer:
  type: "Adam"
  learning_rate: 3e-4

discount: 0.99
steps_per_iter: 200
iters_per_output: 10
test_episodes: 10

exp_buffer_size: 100000
batch_size: 256
init_samples: 2000        # Faster learning
updates_per_iter: 50      # Higher sample efficiency
actor_update_interval: 1
target_update_interval: 1

tau: 0.005
alpha: 0.2                # Improve exploration
